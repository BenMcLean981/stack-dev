name: Release
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Lets the job mint a short-lived OIDC token, which is what npm trusted
  # publishing authenticates with instead of a stored NPM_TOKEN.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install pnpm
        # No version here on purpose: the root packageManager field decides,
        # the same way ci.yml does it. Trusted publishing needs pnpm >= 10.33.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        # v6 or newer is required for trusted publishing.
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      # pnpm delegates the OIDC exchange to whatever npm is on PATH, and
      # trusted publishing needs npm >= 11.5.1. Node 22 bundles npm 10, so
      # upgrade it. Pinned to a major so a future npm cannot change publishing
      # behavior without a deliberate bump here.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install --global npm@12
          npm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # This runs pnpm publish -r under the hood
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN on purpose. changesets only hands publishing over to
          # OIDC when it finds no token to write into .npmrc, so the absence of
          # this line is what switches trusted publishing on.

      # A release that fails is otherwise silent — the run goes red and nothing
      # says so. This is how main ended up claiming 0.4.0 while npm served
      # 0.3.5 for months.
      - name: Open an issue if the release failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Release failed';

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'release-failure',
            });

            const body = [
              `The Release workflow failed on \`${context.sha}\`.`,
              '',
              `Run: ${run}`,
              '',
              'If the publish step reported `E404 Not Found - PUT`, that is an',
              'authentication failure rather than a missing package — most',
              'likely an expired `NPM_TOKEN`. npm caps granular write tokens at',
              '90 days. See `docs/releasing.md` for how to stop relying on one.',
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });

              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['release-failure'],
            });
